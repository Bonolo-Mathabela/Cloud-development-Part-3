name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_TAG: v3.0.${{ github.run_number }}

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Overall POE/Part 3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the projects
        run: |
          dotnet build CoffeeNChill/CoffeeNChill.csproj -c Release
          dotnet build CoffeeNChill.Gateway/CoffeeNChill.Gateway.csproj -c Release

      - name: Run unit tests
        run: dotnet test CoffeeNChill.Tests/CoffeeNChill.Tests.csproj -c Release

      - name: Package Docker images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions:${{ env.IMAGE_TAG }} ./CoffeeNChill
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-gateway:${{ env.IMAGE_TAG }} ./CoffeeNChill.Gateway

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-gateway:${{ env.IMAGE_TAG }}

      - name: Deploy to the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/coffeenchill/"Overall POE/Part 3"
            git pull origin main
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ env.IMAGE_TAG }}/" .env
            docker compose pull && docker compose up -d
